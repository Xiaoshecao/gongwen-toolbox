# 由「规则集设置」修改保存
features:
  end_mark: false
  header_rule: true
  page_number: false
  page_number_fmt: — {n} —
  page_number_font: 宋体
  page_number_size_pt: 14
name: 标准公文
page:
  bottom_cm: 3.5
  footer_cm: 2.8
  left_cm: 2.8
  right_cm: 2.6
  size: A4
  top_cm: 3.7
roles:
  body:
    align: justify
    first_line_chars: 2
    font: 仿宋_GB2312
    line_pt: 28
    size_pt: 16
  date:
    align: right
    first_line_chars: 0
    font: 仿宋_GB2312
    line_pt: 28
    right_indent_chars: 2
    size_pt: 16
  h1:
    align: justify
    first_line_chars: 2
    font: 黑体
    line_pt: 28
    size_pt: 16
  h2:
    align: justify
    first_line_chars: 2
    font: 楷体_GB2312
    line_pt: 28
    size_pt: 16
  h3:
    align: justify
    bold: true
    first_line_chars: 2
    font: 仿宋_GB2312
    line_pt: 28
    size_pt: 16
  lead:
    align: justify
    first_line_chars: 2
    font: 楷体_GB2312
    line_pt: 28
    size_pt: 16
  note:
    align: left
    first_line_chars: 0
    font: 仿宋_GB2312
    line_pt: 20
    size_pt: 12
  signature:
    align: right
    first_line_chars: 0
    font: 仿宋_GB2312
    line_pt: 28
    right_indent_chars: 2
    size_pt: 16
  subtitle:
    align: center
    font: 楷体_GB2312
    line_pt: 28
    size_pt: 16
    space_after_pt: 12
  table_caption:
    align: center
    first_line_chars: 0
    font: 方正小标宋简体
    line_pt: 28
    size_pt: 16
    space_after_pt: 6
    space_before_pt: 6
  title:
    align: center
    first_line_chars: 0
    font: 方正小标宋简体
    line_pt: 32
    size_pt: 22
    space_after_pt: 18
table:
  align: center
  font: 仿宋_GB2312
  size_pt: 14.0
